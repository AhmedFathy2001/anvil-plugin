plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

// 'latest.release' rather than a pinned number: the dev client has to match the LIVE game revision
// or it crashes on startup reading enums out of a stale cache ("your client is out of date"), and a
// pin silently rots the moment Jagex pushes an update. It's also what the plugin hub builds against.
def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.anvil'
// Single source of truth for the plugin version: BingoApiClient reads the same resource at runtime
// and sends it to sites as X-Anvil-Plugin-Version (see docs/PLUGIN_WIRE.md in the anvil site repo).
version = file('src/main/resources/com/anvil/version.txt').text.trim()
sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('runClient', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.anvil.AnvilPluginTest'
    jvmArgs = ['-ea']
    // ./gradlew runClient -Danvil.site=https://beta.anvilosrs.com — hand it on to the client's JVM
    // (a -D on the gradle line only reaches gradle's own). ANVIL_SITE in the environment works too.
    if (System.getProperty('anvil.site')) {
        systemProperty 'anvil.site', System.getProperty('anvil.site')
    }
    // A second account side by side: ./gradlew runClient -Prlhome=$HOME/rl-b
    // RuneLite reads ${user.home}/.runelite (config + credentials.properties), so a home holding
    // account B's credentials logs that client into B, with its own settings and Anvil token.
    if (project.hasProperty('rlhome')) {
        systemProperty 'user.home', project.property('rlhome')
    }
    // RuneLite's own flags, e.g. -Prlargs="--developer-mode --debug"
    if (project.hasProperty('rlargs')) {
        args project.property('rlargs').toString().trim().split('\\s+')
    }
}
