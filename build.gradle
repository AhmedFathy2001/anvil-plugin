plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

// 'latest.release' rather than a pinned number: the dev client has to match the LIVE game revision
// or it crashes on startup reading enums out of a stale cache ("your client is out of date"), and a
// pin silently rots the moment Jagex pushes an update. It's also what the plugin hub builds against.
def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.anvil'
// Single source of truth for the plugin version: BingoApiClient reads the same resource at runtime
// and sends it to sites as X-Anvil-Plugin-Version (see docs/PLUGIN_WIRE.md in the anvil site repo).
version = file('src/main/resources/com/anvil/version.txt').text.trim()
sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // Java's own lint is the typecheck: no extra dependency, nothing to download, and it catches the
    // things that actually bite here — a deprecated client API we are still calling, an unchecked
    // cast, a switch that falls through, a resource left open.
    //
    // Four categories are off, and the reason is that every one of them fires on code that is not
    // ours to fix. `serial` wants serialVersionUID on a Swing panel and on exception types nobody
    // serialises. `this-escape` fires on the RuneLite base classes we extend. `processing` is Lombok
    // and Guice annotations that no processor claims. `classfile` is javac failing to read
    // org.jetbrains.annotations.Range out of the RuneLite jars, which is not on our classpath and
    // does not need to be.
    options.compilerArgs << '-Xlint:all,-serial,-this-escape,-processing,-classfile'

    // Warnings are visible always; they only FAIL the build when asked for by name:
    //
    //     ./gradlew build -PanvilStrict
    //
    // Deliberately not on by default. The plugin hub compiles this against whichever RuneLite
    // version IT pins, not ours, and a warning that only appears there would break a release for
    // something nobody could see locally.
    if (project.hasProperty('anvilStrict')) {
        options.compilerArgs << '-Werror'
    }
}

tasks.register('runClient', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.anvil.AnvilPluginTest'
    jvmArgs = ['-ea']
}
